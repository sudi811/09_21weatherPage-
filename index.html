<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Windy.com 風格真實比例即時氣候雷達與動態風場地圖，提供全臺灣與東亞海域真實氣象、風速、溫度、降雨與衛星雲圖。">
  <title>Windy.com - 氣象雷達與動態風場</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23c93f41'/><text x='50%' y='68%' font-size='50' font-weight='bold' fill='white' text-anchor='middle'>W</text></svg>">
</head>
<body class="windy-body">

  <!-- 全螢幕真實比例風場地圖視圖容器 -->
  <div class="windy-viewport" id="windyViewport">

    <!-- 底層動態彩色氣象熱力圖層 (動態切換：風速/雷達/溫度/降雨) -->
    <div class="windy-thermal-overlay" id="thermalOverlay"></div>

    <!-- 真實比例東亞與臺灣向量地圖舞台 (支援平移與縮放) -->
    <div class="windy-map-stage" id="mapStage">
      <svg class="windy-svg-map" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
        <!-- 海洋背景 -->
        <rect x="0" y="0" width="1600" height="1000" class="ocean-base" />

        <!-- 經緯度參考網格與等壓線 -->
        <g class="pressure-isobars" id="isobarGroup">
          <circle cx="1200" cy="250" r="180" class="isobar-line" />
          <circle cx="1200" cy="250" r="130" class="isobar-line" />
          <circle cx="1200" cy="250" r="80" class="isobar-line" />
          <circle cx="1200" cy="250" r="30" class="isobar-center" />
          <text x="1200" y="255" class="isobar-label">965 hPa 🌀 氣旋中心</text>

          <ellipse cx="600" cy="400" rx="360" ry="240" class="isobar-line" />
          <ellipse cx="600" cy="400" rx="260" ry="160" class="isobar-line" />
          <text x="480" y="320" class="isobar-label">1012 hPa</text>
        </g>

        <!-- 中國東南沿海 (福建、浙江、廣東) -->
        <path class="continent-land" d="
          M 0 0 
          L 550 0 
          C 530 80, 520 160, 500 240 
          C 480 320, 460 370, 450 420 
          C 435 480, 410 540, 390 600 
          C 360 670, 310 730, 260 800 
          C 200 870, 100 930, 0 1000 Z
        " />

        <!-- 臺灣本島 (居中真實經緯度比例) -->
        <!-- 經度約 120°E~122°E, 緯度約 21.8°N~25.3°N -->
        <g class="taiwan-archipelago" transform="translate(620, 380)">
          <!-- 臺灣本島 -->
          <path class="taiwan-mainland" d="
            M 120 0 
            C 140 15, 170 45, 178 70 
            C 185 95, 172 130, 160 160 
            C 148 195, 148 240, 138 290 
            C 126 340, 100 390, 72 430 
            C 62 445, 50 450, 44 445 
            C 36 440, 34 425, 32 395 
            C 24 350, 15 300, 10 250 
            C 4 200, 18 150, 38 100 
            C 58 50, 85 20, 120 0 Z
          " />
          <text x="65" y="220" class="map-place-name">臺灣</text>

          <!-- 澎湖群島 -->
          <g class="penghu-islands" transform="translate(-45, 160)">
            <circle cx="10" cy="15" r="9" class="island-shape" />
            <circle cx="0" cy="25" r="5" class="island-shape" />
            <circle cx="20" cy="12" r="4" class="island-shape" />
            <text x="0" y="42" class="sub-place-name">澎湖</text>
          </g>
        </g>

        <!-- 琉球群島 (沖繩至與那國島) -->
        <g class="ryukyu-islands" transform="translate(800, 340)">
          <path d="M 0 60 Q 50 40, 110 0" stroke="#7e9e78" stroke-width="4" fill="none" stroke-dasharray="8,15" />
          <circle cx="15" cy="50" r="5" class="island-shape" />
          <circle cx="45" cy="35" r="6" class="island-shape" />
          <circle cx="85" cy="18" r="8" class="island-shape" />
          <circle cx="130" cy="-5" r="10" class="island-shape" />
          <text x="95" y="0" class="sub-place-name">沖繩</text>
        </g>

        <!-- 日本本州與九州 (東北方海域) -->
        <path class="continent-land" d="
          M 980 0 
          C 1000 50, 1050 100, 1100 130 
          C 1140 150, 1200 140, 1260 110 
          C 1320 80, 1400 40, 1600 0 Z
        " />
        <text x="1100" y="80" class="map-place-name">日本</text>

        <!-- 菲律賓群島 (南方海域) -->
        <g class="philippines-islands" transform="translate(580, 750)">
          <path class="island-shape" d="M 30 0 C 60 20, 70 80, 50 140 C 30 200, 60 230, 80 250 L 0 250 Z" />
          <circle cx="80" cy="60" r="14" class="island-shape" />
          <circle cx="110" cy="120" r="18" class="island-shape" />
          <text x="50" y="100" class="map-place-name">菲律賓</text>
        </g>
      </svg>

      <!-- 全臺灣 22 縣市測站標記圖層 (帶有即時數值膠囊) -->
      <div class="windy-stations-layer" id="stationsLayer">
        <!-- 由 js/app.js 動態渲染 -->
      </div>

      <!-- 點擊地圖任意處彈出的 Windy 預報氣候選擇卡 (Weather Picker) -->
      <div class="windy-picker-card" id="windyPickerCard" style="display: none;">
        <div class="picker-header">
          <div class="picker-place-title" id="pickerPlace">臺北市</div>
          <button class="picker-close-btn" id="pickerCloseBtn">&times;</button>
        </div>
        <div class="picker-main">
          <div class="picker-temp" id="pickerTemp">26.8°C</div>
          <div class="picker-weather" id="pickerWeather">🌤️ 晴時多雲</div>
        </div>
        <div class="picker-details">
          <div class="picker-row">
            <span>💨 風向風速</span>
            <strong id="pickerWind">東北風 3.2 m/s (6.2 kt)</strong>
          </div>
          <div class="picker-row">
            <span>🌧️ 降雨量</span>
            <strong id="pickerRain">0.0 mm</strong>
          </div>
          <div class="picker-row">
            <span>💧 相對濕度</span>
            <strong id="pickerHum">74%</strong>
          </div>
          <div class="picker-row">
            <span>🧭 大氣壓力</span>
            <strong id="pickerPres">1011.2 hPa</strong>
          </div>
        </div>
        <div class="picker-arrow"></div>
      </div>

    </div>

    <!-- 全螢幕動態風場氣流粒子 Canvas -->
    <canvas id="windCanvas"></canvas>

    <!-- ====================================================================
         頂部品牌導航列 (Top Bar)
         ==================================================================== -->
    <header class="windy-top-bar">
      <div class="top-left-group">
        <button class="top-icon-btn" title="分享與匯出">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
            <polyline points="16 6 12 2 8 6"/>
            <line x1="12" y1="2" x2="12" y2="15"/>
          </svg>
        </button>

        <!-- Windy 標誌 -->
        <div class="windy-brand-logo">
          <div class="logo-red-circle">
            <span class="logo-w">W</span>
          </div>
          <span class="logo-text">Windy<span class="logo-dotcom">.com</span></span>
          <span class="logo-tag">南盟</span>
        </div>

        <!-- 搜尋列 -->
        <div class="windy-search-wrap">
          <input type="text" class="windy-search-input" id="windySearchInput" placeholder="搜尋全臺縣市或地點...">
          <button class="search-btn" id="btnSearch">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="top-right-group">
        <button class="btn-premium">
          <span>👑 使用高級版</span>
        </button>
        <button class="btn-login">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          <span>登入</span>
        </button>
      </div>
    </header>

    <!-- ====================================================================
         右側經典圓形圖層選單 (Right Side Layer Menu - 截圖完全還原)
         ==================================================================== -->
    <aside class="windy-right-menu">
      
      <!-- 頂部紅色選單按鈕 -->
      <button class="menu-main-btn" id="btnMainMenu" title="選單">
        <span class="btn-text">選單</span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8">
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <!-- 垂直圖層選項清單 -->
      <nav class="layer-list" id="layerNav">
        
        <button class="layer-item" data-layer="radar" title="氣象雷達回波">
          <span class="layer-name">氣象雷達</span>
          <span class="layer-circle-icon icon-radar"></span>
        </button>

        <button class="layer-item" data-layer="satellite" title="真實可見光與紅外衛星雲圖">
          <span class="layer-name">衛星</span>
          <span class="layer-circle-icon icon-satellite"></span>
        </button>

        <button class="layer-item active" data-layer="wind" title="表面即時風速與風場氣流">
          <span class="layer-name">風速</span>
          <span class="layer-circle-icon icon-wind"></span>
        </button>

        <button class="layer-item" data-layer="rain" title="降雨強度與雷暴監測">
          <span class="layer-name">降雨、雷暴</span>
          <span class="layer-circle-icon icon-rain"></span>
        </button>

        <button class="layer-item" data-layer="temp" title="地表即時氣溫分佈">
          <span class="layer-name">溫度</span>
          <span class="layer-circle-icon icon-temp"></span>
        </button>

        <button class="layer-item" data-layer="hurricane" title="熱帶氣旋與颱風路徑追蹤">
          <span class="layer-name">颱風追蹤器</span>
          <span class="layer-circle-icon icon-hurricane"></span>
        </button>

        <button class="layer-item" data-layer="clouds" title="雲層總量與高低層雲">
          <span class="layer-name">雲</span>
          <span class="layer-circle-icon icon-clouds"></span>
        </button>

        <button class="layer-item" data-layer="waves" title="海洋湧浪與浪高預報">
          <span class="layer-name">波浪</span>
          <span class="layer-circle-icon icon-waves"></span>
        </button>

        <button class="layer-item" data-layer="accumRain" title="未來數日累積降雨量">
          <span class="layer-name">累積雨量</span>
          <span class="layer-circle-icon icon-accum-rain"></span>
        </button>

        <button class="layer-item" data-layer="rain" title="雷暴放電監測">
          <span class="layer-name">雷暴</span>
          <span class="layer-circle-icon icon-thunder"></span>
        </button>

        <button class="layer-item" data-layer="wind" title="高度氣流觀測">
          <span class="layer-name">高度 ✈️</span>
          <span class="layer-circle-icon icon-altitude"></span>
        </button>

      </nav>
    </aside>

    <!-- ====================================================================
         右下角浮動控制按鈕 (Map Controls & Toggles)
         ==================================================================== -->
    <div class="windy-floating-controls">
      
      <!-- 氣壓與粒子動畫開關 -->
      <div class="toggle-bar">
        <label class="toggle-pill">
          <input type="checkbox" id="togglePressure" checked>
          <span class="toggle-indicator"></span>
          <span class="toggle-label">氣壓</span>
        </label>

        <label class="toggle-pill">
          <input type="checkbox" id="toggleParticles" checked>
          <span class="toggle-indicator"></span>
          <span class="toggle-label">粒子動畫</span>
        </label>
      </div>

      <!-- 地圖縮放與視角按鈕 (完全對齊截圖) -->
      <div class="btn-group-primary">
        <button class="ctrl-btn" id="btnZoomIn" title="放大">+</button>
        <button class="ctrl-btn" id="btnZoomOut" title="縮小">&minus;</button>
        <button class="ctrl-btn text-btn" id="btn3D" title="3D 地球模式">3D</button>
        <button class="ctrl-btn icon-btn" id="btnInfo" title="資訊">ⓘ</button>
        <button class="ctrl-btn icon-btn" id="btnCyclone" title="氣旋追蹤">🌀</button>
        <button class="ctrl-btn icon-btn" id="btnFullscreen" title="全螢幕">⛶</button>
      </div>

      <!-- 下方快捷圖示列 -->
      <div class="btn-group-secondary">
        <button class="sub-ctrl-btn" title="天氣預報">🌦️</button>
        <button class="sub-ctrl-btn" title="機場與測站">🚩</button>
        <button class="sub-ctrl-btn" title="航線風向">✈️</button>
        <button class="sub-ctrl-btn" title="實況視訊">📹</button>
        <button class="sub-ctrl-btn active-amber" id="btnResetView" title="重設至臺灣中心">✖</button>
      </div>

    </div>

    <!-- ====================================================================
         底部預報時間軸與數值色階 (Timeline Player & Legend Bar)
         ==================================================================== -->
    <footer class="windy-bottom-dock">
      
      <div class="timeline-container">
        <!-- 播放/暫停按鈕 -->
        <button class="timeline-play-btn" id="btnPlayTimeline" title="播放預報時間軸">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="6 4 20 12 6 20 6 4"/>
          </svg>
        </button>

        <!-- 時間軸日期項目 -->
        <div class="timeline-track" id="timelineTrack">
          <div class="timeline-day active" data-day="0">
            <span class="day-label">四 24</span>
            <span class="day-icon">☀️</span>
          </div>
          <div class="timeline-day" data-day="1">
            <span class="day-label">五 25</span>
            <span class="day-icon">⛅</span>
          </div>
          <div class="timeline-day" data-day="2">
            <span class="day-label">六 26</span>
            <span class="day-icon">🌧️</span>
          </div>
          <div class="timeline-day" data-day="3">
            <span class="day-label">日 27</span>
            <span class="day-icon">🌤️</span>
          </div>
          <div class="timeline-day" data-day="4">
            <span class="day-label">一 28</span>
            <span class="day-icon">☀️</span>
          </div>
          <div class="timeline-day" data-day="5">
            <span class="day-label">二 29</span>
            <span class="day-icon">⛅</span>
          </div>
          <div class="timeline-day" data-day="6">
            <span class="day-label">三 30</span>
            <span class="day-icon">☀️</span>
          </div>
          <div class="timeline-day" data-day="7">
            <span class="day-label">四 1</span>
            <span class="day-icon">🌦️</span>
          </div>
          <div class="timeline-day" data-day="8">
            <span class="day-label">五 2</span>
            <span class="day-icon">🌧️</span>
          </div>
          <div class="timeline-day" data-day="9">
            <span class="day-label">六 3</span>
            <span class="day-icon">⛅</span>
          </div>
        </div>
      </div>

      <!-- 右側：預報模型切換與彩色數值標尺 -->
      <div class="legend-and-models">
        
        <!-- 氣象模型切換按鈕群 -->
        <div class="model-picker-bar">
          <button class="model-btn active" data-model="ecmwf">ECMWF <span>9km</span></button>
          <button class="model-btn" data-model="gfs">GFS <span>22km</span></button>
          <button class="model-btn" data-model="icon">ICON <span>13km</span></button>
          <button class="model-btn more-btn">2 更多...</button>
        </div>

        <!-- 彩色數值階層標尺 (隨當前圖層即時動態更新) -->
        <div class="color-scale-bar" id="colorScaleBar">
          <span class="scale-unit" id="scaleUnit">kt</span>
          <div class="scale-blocks-wrap" id="scaleBlocksWrap">
            <!-- 由 js/app.js 動態渲染色塊與刻度 -->
          </div>
        </div>

      </div>

    </footer>

  </div>

  <!-- 應用邏輯腳本 -->
  <script src="js/weather-data.js"></script>
  <script src="js/wind-canvas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
